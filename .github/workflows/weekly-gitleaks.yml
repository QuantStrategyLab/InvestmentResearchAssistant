# Keep the shared ref pinned to a reviewed full commit SHA.
name: Weekly all-branch secret scan

on:
  # The weekly unattended scan is paused. Pull-request Gitleaks still runs.
  # workflow_dispatch remains for a manual run after a later decision.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret scan
    uses: QuantStrategyLab/.github/.github/workflows/gitleaks.yml@0da4da68433b803cda17d3f84e29875a94a32273
    with:
      full-history: true
